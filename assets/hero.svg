    <text x="24" y="200" font-size="11.5" letter-spacing="0.5" fill="#6b7684" fill-opacity="0.8">把重复的脏活，做成一次配置就能跑的工具。</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" letter-spacing="2.2" fill="#6b7684">
