<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="ZiChuanLan">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <path id="petal" d="M0 0C-8.5-9.5-8.5-24.5 0-32 8.5-24.5 8.5-9.5 0 0Z"/>
    <g id="blossom">
      <g fill="none" stroke="#f472b6" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
