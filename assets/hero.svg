        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <circle r="2.4" fill="#f472b6"/>
    </g>
  </defs>

  <g stroke="#6b7684" stroke-opacity="0.38" stroke-width="1">
    <line x1="24" y1="40" x2="856" y2="40"/>
    <line x1="24" y1="238" x2="856" y2="238"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', 'Microsoft YaHei', sans-serif" fill="#6b7684">
