    <text x="160" y="266" fill-opacity="0.45">/</text>
    <text x="182" y="266">AGGREGATION</text>
    <text x="318" y="266" fill-opacity="0.45">/</text>
    <text x="340" y="266">CONTENT</text>
  </g>

  <circle cx="726" cy="138" r="62" fill="none" stroke="#f472b6" stroke-opacity="0.16" stroke-width="1"/>

  <path d="M662 240C718 212 748 174 786 146 810 128 826 116 838 106" fill="none" stroke="#6b7684" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round"/>

  <use href="#blossom" transform="translate(838 106) scale(0.82)"/>
  <use href="#blossom" transform="translate(786 146) scale(0.56)"/>
  <use href="#blossom" transform="translate(722 192) scale(0.4)"/>
  <use href="#blossom" transform="translate(672 230) scale(0.3)"/>

  <g fill="#f472b6" fill-opacity="0.3">
