    <text x="856" y="28" font-size="10" letter-spacing="2.5" text-anchor="end">つくるひと</text>
  </g>

  <text x="20" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="300" letter-spacing="9" fill="url(#ink)">ZI CHUAN LAN</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', 'Microsoft YaHei', sans-serif">
